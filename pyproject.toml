[project]
name = "extend-init"
version = "0.7.0"
description = "A Python program that gives you a customized sane template to start with."
readme = "README.md"
authors = [
  { name="Placewith5s" }
]
requires-python = ">=3.14"
dependencies = [
    "build>=1.5.0",
    "prompt-toolkit==3.0.52",
    "questionary==2.1.1",
    "twine>=6.2.0",
    "wcwidth==0.7.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
extend-init = "extend_init.main:main"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["extend_init"]

[project.urls]
Homepage = "https://github.com/placewith5s/extend-init"
Issues = "https://github.com/placewith5s/extend-init/issues"
